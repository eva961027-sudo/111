<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U1558010 - 野原新之助的祕密基地</title>
    
    <style>
        /* 全面樣式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            background: linear-gradient(135deg, #fff3b0 0%, #cae9ff 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
        }

        .header {
            text-align: center;
            margin: 2.5rem 0 1.5rem;
        }

        .header h1 {
            font-size: 2.2rem;
            color: #ff4757;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .header p {
            color: #57606f;
            font-size: 1.1rem;
            font-weight: bold;
        }

        /* 展示五個圖片的容器 */
        .gallery-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            max-width: 1100px;
            padding: 20px;
        }

        /* 圖片卡片樣式 */
        .image-card {
            display: block;
            width: 190px;
            height: 190px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background-color: #fff;
            text-decoration: none;
            border: 4px solid #fff;
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 滑鼠移過圖片會動 (Hover 動畫) */
        .image-card:hover {
            transform: translateY(-10px) scale(1.08) rotate(3deg);
            box-shadow: 0 15px 30px rgba(255, 71, 87, 0.3);
            cursor: pointer;
        }

        .footer {
            margin-top: auto;
            padding: 2rem;
            text-align: center;
            color: #747d8c;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- 歡樂活潑的標題區塊 -->
    <header class="header">
        <h1>🍑 歡迎來到野原新之助的祕密基地 🍑</h1>
        <p>✨ U1558010 的動感相簿！點擊任意圖片前往傳送門 ✨</p>
    </header>

    <!-- 展示 5 張圖片 -->
    <main class="gallery-container">
        <a href="https://www.nuu.edu.tw/" target="_blank" class="image-card">
            <img src="https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=600&q=80" alt="蠟筆小新 1">
        </a>

        <a href="https://www.nuu.edu.tw/" target="_blank" class="image-card">
            <img src="https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&w=600&q=80" alt="蠟筆小新 2">
        </a>

        <a href="https://www.nuu.edu.tw/" target="_blank" class="image-card">
            <img src="https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?auto=format&fit=crop&w=600&q=80" alt="蠟筆小新 3">
        </a>

        <a href="https://www.nuu.edu.tw/" target="_blank" class="image-card">
            <img src="https://images.unsplash.com/photo-1563089145-599997674d42?auto=format&fit=crop&w=600&q=80" alt="蠟筆小新 4">
        </a>

        <a href="https://www.nuu.edu.tw/" target="_blank" class="image-card">
            <img src="https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=600&q=80" alt="蠟筆小新 5">
        </a>
    </main>

    <footer class="footer">
        <p>學號：U1558010 | 動感超人超級特攻隊</p>
    </footer>

</body>
</html>
